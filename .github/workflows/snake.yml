name: Generate snake animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_dots=#ffffff10,#0e4429,#006d32,#26a641,#39d353&color_dot_border=#00000000

      - name: Remove progress bar
        run: |
          for f in dist/*.svg; do
            sudo sed -i -E 's#<rect class="u [^>]*/>##g; s#(viewBox="[^ ]+ [^ ]+ [^ ]+) 192" (width="[^"]+") height="192"#\1 160" \2 height="160"#' "$f"
          done

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
